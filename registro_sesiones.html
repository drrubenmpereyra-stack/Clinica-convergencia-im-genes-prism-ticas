<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia - Registro de Sesiones</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --purple-glow: 0 0 12px rgba(186, 85, 211, 0.6), 0 0 24px rgba(160, 32, 240, 0.4);
            --purple-border: #ba55d3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(18, 16, 28, 0.92);
            color: #f1f1f1;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .admin-container, .card { 
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            background: rgba(18, 16, 28, 0.88);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(186, 85, 211, 0.3);
            box-sizing: border-box;
        }

        .admin-title, h2 { 
            color: #e2b7ff; 
            font-size: 1.2rem; 
            margin-top: 0; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            border-bottom: 1px solid rgba(186, 85, 211, 0.3); 
            padding-bottom: 8px; 
        }

        .form-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 5px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 5px; text-align: left; }
        label { font-size: 0.85rem; font-weight: 600; color: #d8b4fe; }
        
        input, select, textarea { 
            padding: 10px 12px; 
            background: rgba(28, 25, 42, 0.8); 
            border: 1px solid rgba(186, 85, 211, 0.3); 
            border-radius: 8px; 
            font-size: 0.95rem; 
            color: #fff; 
            outline: none; 
            transition: all 0.3s ease; 
        }
        
        input:focus, select:focus, textarea:focus { 
            border-color: var(--purple-border); 
            box-shadow: var(--purple-glow); 
        }

        select option { background: #1c192a; color: #fff; }
        
        .textarea-wrapper { position: relative; }
        textarea { width: 100%; min-height: 140px; resize: vertical; padding-right: 45px; box-sizing: border-box; }
        
        .mic-btn {
            position: absolute; right: 10px; top: 10px; background: rgba(28, 25, 42, 0.9); border: 1px solid rgba(186, 85, 211, 0.3);
            width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex;
            align-items: center; justify-content: center; color: #d8b4fe; transition: all 0.2s;
        }
        .mic-btn:hover { background: rgba(186, 85, 211, 0.25); color: #fff; }
        .mic-btn.recording { background: #ef4444; color: white; border-color: #ef4444; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .btn { 
            background: linear-gradient(135deg, #9b59b6, #8e44ad); 
            color: white; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.9rem; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px; 
            box-shadow: 0 4px 10px rgba(160, 32, 240, 0.4);
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: var(--purple-glow); }

        .session-card { background: rgba(28, 25, 42, 0.7); border-left: 4px solid var(--purple-border); padding: 15px; border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(186, 85, 211, 0.2); }
        .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(186, 85, 211, 0.2); padding-bottom: 6px; }
    </style>

    <!-- SDKs de Firebase Compat alineados -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <main class="container">
        <div class="card">
            <h2><i class="fa-solid fa-user-injured"></i> Seleccionar Paciente</h2>
            <div class="form-group">
                <label for="session-patient">Paciente Activo</label>
                <select id="session-patient" onchange="loadPatientSessions()">
                    <option value="">-- Seleccione un paciente --</option>
                </select>
            </div>
        </div>

        <div id="session-form-card" class="card" style="display: none;">
            <h2><i class="fa-solid fa-pen-nib"></i> Registrar Nueva Sesión</h2>
            <form id="session-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="session-title">Título / Nro. de Sesión</label>
                        <input type="text" id="session-title" required placeholder="Ej. Sesión Ordinaria N° 4">
                    </div>
                    <div class="form-group">
                        <label for="session-date">Fecha de Sesión</label>
                        <input type="date" id="session-date" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="session-narrative">Narrativa Principal (Tipee o use el micrófono)</label>
                    <div class="textarea-wrapper">
                        <textarea id="session-narrative" placeholder="Desarrolle los ejes centrales de la sesión, intervenciones y material clínico..."></textarea>
                        <button type="button" id="mic-toggle-btn" class="mic-btn" title="Dictar por voz" onclick="toggleSpeechRecognition()">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>
                    <span id="mic-status" style="font-size: 0.75rem; color: #c084fc; margin-top: 3px; display: block;"></span>
                </div>
                <button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Guardar Sesión en la Nube</button>
            </form>
        </div>

        <div id="sessions-history-card" class="card" style="display: none;">
            <h2><i class="fa-solid fa-timeline"></i> Evolución y Bitácora de Sesiones</h2>
            
            <div class="form-grid" style="grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; margin-bottom: 10px; background: rgba(28, 25, 42, 0.9); padding: 15px; border-radius: 8px; border: 1px solid rgba(186, 85, 211, 0.2);">
                <div class="form-group">
                    <label for="report-from">Desde</label>
                    <input type="date" id="report-from">
                </div>
                <div class="form-group">
                    <label for="report-to">Hasta</label>
                    <input type="date" id="report-to">
                </div>
                <button type="button" class="btn" style="background: linear-gradient(135deg, #8e44ad, #6c3483);" onclick="conformarInformeSesiones()">
                    <i class="fa-solid fa-file-waveform"></i> Conformar Informe
                </button>
            </div>

            <div id="sessions-container">
                <p style="color: #b19cd9; font-size: 0.9rem; text-align: center; padding: 15px;">Seleccione un paciente para ver sus registros previos.</p>
            </div>
        </div>
    </main>

    <script>
        let db;
        let activePatientId = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof firebase === 'undefined') {
                alert("Error crítico: Firebase no está disponible.");
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyAd5dyriu-Z2Gms1Tq9u8A75LrQKHd0GC8",
                authDomain: "aplicacion1-c794d.firebaseapp.com",
                projectId: "aplicacion1-c794d",
                storageBucket: "aplicacion1-c794d.firebasestorage.app",
                messagingSenderId: "310699962592",
                appId: "1:310699962592:web:71794de4268e47b35da085",
                measurementId: "G-R3QHSGSNQB"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();

            initSecciones();
        });

        async function initSecciones() {
            try {
                const querySnapshot = await db.collection("pacientes").get();
                const selectEl = document.getElementById('session-patient');
                selectEl.innerHTML = '<option value="">-- Seleccione un paciente --</option>';
                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.textContent = data.nombre || data.name || `Paciente (${docSnap.id})`;
                    selectEl.appendChild(opt);
                });
            } catch (error) {
                console.error("Error al cargar pacientes:", error);
            }
        }

        window.loadPatientSessions = async function() {
            activePatientId = document.getElementById('session-patient').value;
            const formCard = document.getElementById('session-form-card');
            const historyCard = document.getElementById('sessions-history-card');

            if (!activePatientId) {
                formCard.style.display = 'none';
                historyCard.style.display = 'none';
                return;
            }

            formCard.style.display = 'flex';
            historyCard.style.display = 'flex';
            document.getElementById('session-date').valueAsDate = new Date();
            renderSessions();
        }

        async function renderSessions() {
            const container = document.getElementById('sessions-container');
            container.innerHTML = '<p style="color: #c084fc; font-size: 0.9rem; text-align: center;">Cargando bitácora...</p>';

            try {
                const patientRef = db.collection("pacientes").doc(activePatientId);
                const patientSnap = await patientRef.get();
                
                if (patientSnap.exists) {
                    const data = patientSnap.data();
                    const sessions = data.sessions || [];
                    
                    container.innerHTML = '';
                    if (sessions.length === 0) {
                        container.innerHTML = '<p style="color: #b19cd9; font-size: 0.9rem; text-align: center; padding: 15px;">No hay sesiones registradas para este paciente.</p>';
                        return;
                    }

                    sessions.sort((a, b) => new Date(b.date) - new Date(a.date));

                    sessions.forEach(s => {
                        const div = document.createElement('div');
                        div.className = 'session-card';
                        div.innerHTML = `
                            <div class="session-header">
                                <strong style="color: #e2b7ff;"><i class="fa-solid fa-calendar-day"></i> ${s.title}</strong>
                                <span style="font-size: 0.8rem; color: #d8b4fe;">Fecha: ${s.date}</span>
                            </div>
                            <p style="font-size: 0.9rem; color: #e5e5e5; white-space: pre-line;">${s.narrative}</p>
                        `;
                        container.appendChild(div);
                    });
                }
            } catch (error) {
                console.error("Error al renderizar sesiones:", error);
            }
        }

        document.getElementById('session-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!activePatientId) return;

            const newSession = {
                id: Date.now().toString(),
                title: document.getElementById('session-title').value.trim(),
                date: document.getElementById('session-date').value,
                narrative: document.getElementById('session-narrative').value.trim()
            };

            try {
                const patientRef = db.collection("pacientes").doc(activePatientId);
                const patientSnap = await patientRef.get();
                let sessions = patientSnap.data().sessions || [];
                sessions.push(newSession);

                await patientRef.update({ sessions: sessions });
                document.getElementById('session-title').value = '';
                document.getElementById('session-narrative').value = '';
                alert('¡Sesión guardada con éxito en la nube!');
                renderSessions();
            } catch (error) {
                console.error("Error al guardar sesión:", error);
                alert("Error al registrar la sesión.");
            }
        });

        window.conformarInformeSesiones = async function() {
            if (!activePatientId) {
                alert("Seleccione un paciente primero.");
                return;
            }

            const dateFrom = document.getElementById('report-from').value;
            const dateTo = document.getElementById('report-to').value;

            try {
                const patientRef = db.collection("pacientes").doc(activePatientId);
                const patientSnap = await patientRef.get();
                
                if (!patientSnap.exists) return;
                const sessions = patientSnap.data().sessions || [];

                if (sessions.length === 0) {
                    alert("No hay sesiones registradas para conformar un informe.");
                    return;
                }

                const filteredSessions = sessions.filter(s => {
                    if (!s.date) return false;
                    if (dateFrom && s.date < dateFrom) return false;
                    if (dateTo && s.date > dateTo) return false;
                    return true;
                });

                if (filteredSessions.length === 0) {
                    alert("No se encontraron sesiones en el rango de fechas seleccionado.");
                    return;
                }

                filteredSessions.sort((a, b) => new Date(a.date) - new Date(b.date));

                let detalleConsolidado = filteredSessions.map(s => 
                    `[Sesión: ${s.title} - Fecha: ${s.date}]\n${s.narrative}\n--------------------------------------------------`
                ).join('\n\n');

                const nuevoInforme = {
                    titulo: `Registro de Sesiones (${dateFrom || 'Inicio'} al ${dateTo || 'Actualidad'})`,
                    tipo: "Registro de sesiones",
                    fecha: firebase.firestore.FieldValue.serverTimestamp(),
                    detalle: detalleConsolidado,
                    totalSesiones: filteredSessions.length
                };

                await db.collection("pacientes").doc(activePatientId).collection("informes_medicos").add(nuevoInforme);
                alert("¡Informe 'Registro de sesiones' conformado y guardado exitosamente en la base de datos!");
            } catch (error) {
                console.error("Error al conformar informe:", error);
                alert("Ocurrió un error al generar el informe.");
            }
        };

        let recognition = null;
        let isRecording = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-AR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    }
                }
                const textarea = document.getElementById('session-narrative');
                if (finalTranscript) {
                    textarea.value += (textarea.value ? ' ' : '') + finalTranscript;
                }
            };

            recognition.onerror = (event) => {
                console.error("Error de reconocimiento de voz:", event.error);
                stopSpeechRecognition();
            };

            recognition.onend = () => {
                if (isRecording) { recognition.start(); }
            };
        }

        window.toggleSpeechRecognition = function() {
            if (!recognition) {
                alert('Su navegador no soporta el reconocimiento de voz por micrófono. Utilice Google Chrome o Edge.');
                return;
            }

            const btn = document.getElementById('mic-toggle-btn');
            const status = document.getElementById('mic-status');

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                btn.classList.add('recording');
                status.innerHTML = '<i class="fa-solid fa-microphone-lines"></i> Escuchando... Hable con claridad.';
            } else {
                recognition.stop();
                isRecording = false;
                btn.classList.remove('recording');
                status.innerText = 'Dictado finalizado.';
            }
        }
    </script>
</body>
</html>
