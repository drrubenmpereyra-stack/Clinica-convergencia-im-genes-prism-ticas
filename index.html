<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia - Acceso</title>
    <style>
        :root {
            --b1-primary: #ffb3ba; --b1-secondary: #ffccd5; --b1-tertiary: #ffe6eb;
            --b2-primary: #ffdfba; --b2-secondary: #ffeacc; --b2-tertiary: #fff4e6;
            --b3-primary: #ffffba; --b3-secondary: #ffffcc; --b3-tertiary: #ffffe6;
            --b4-primary: #baffc9; --b4-secondary: #d0f7d8; --b4-tertiary: #e6faeb;
            --b5-primary: #bae1ff; --b5-secondary: #d0ebff; --b5-tertiary: #e6f4ff;
            --b6-primary: #e8baff; --b6-secondary: #f0ccff; --b6-tertiary: #f7e6ff;

            --purple-glow: 0 0 12px rgba(186, 85, 211, 0.6), 0 0 24px rgba(160, 32, 240, 0.4);
            --purple-border: #ba55d3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #f1f1f1;
            margin: 0;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .view-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1450px;
        }

        #login-section {
            justify-content: center;
            flex-grow: 1;
        }

        .hidden {
            display: none !important;
        }

        .login-card {
            background: rgba(18, 16, 28, 0.88);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(186, 85, 211, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

        .login-logo {
            width: 100px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(186, 85, 211, 0.4);
            box-shadow: 0 0 10px rgba(160, 32, 240, 0.3);
        }

        .login-title {
            color: #e2b7ff;
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(160, 32, 240, 0.4);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(28, 25, 42, 0.8);
            border: 1px solid rgba(186, 85, 211, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--purple-border);
            box-shadow: var(--purple-glow);
        }

        .login-btn {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(160, 32, 240, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--purple-glow);
        }

        .error-msg {
            color: #ff8080;
            font-size: 0.85rem;
            margin-top: 10px;
            min-height: 20px;
        }

        #app-section {
            margin-top: 5px;
        }

        .app-header {
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(18, 16, 28, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(186, 85, 211, 0.25);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .header-logo {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(186, 85, 211, 0.4);
        }

        .header-titles h1 {
            color: #e2b7ff;
            margin: 0 0 3px 0;
            font-size: 1.45rem;
            text-shadow: 0 2px 6px rgba(160, 32, 240, 0.4);
        }

        .header-titles p {
            color: #d8b4fe;
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 100%;
            background: rgba(18, 16, 28, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(186, 85, 211, 0.25);
            box-sizing: border-box;
        }

        .menu-line {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 40px;
            align-items: center;
            padding: 8px;
            border-radius: 8px;
            background: rgba(28, 25, 42, 0.6);
            border: 1px dashed rgba(186, 85, 211, 0.3);
        }

        .menu-line:empty {
            display: none;
        }

        button.app-btn {
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 2px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            outline: none;
        }

        button.app-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--purple-glow);
            border-color: var(--purple-border);
        }

        button.app-btn.active {
            box-shadow: var(--purple-glow);
            border-color: var(--purple-border);
            transform: scale(1.03);
        }

        .btn-b1-p { background-color: var(--b1-primary); color: #5a1a24; }
        .btn-b1-s { background-color: var(--b1-secondary); color: #5a1a24; }
        .btn-b1-t { background-color: var(--b1-tertiary); color: #5a1a24; }

        .btn-b2-p { background-color: var(--b2-primary); color: #5a381a; }
        .btn-b2-s { background-color: var(--b2-secondary); color: #5a381a; }
        .btn-b2-t { background-color: var(--b2-tertiary); color: #5a381a; }

        .btn-b3-p { background-color: var(--b3-primary); color: #5a5a1a; }
        .btn-b3-s { background-color: var(--b3-secondary); color: #5a5a1a; }
        .btn-b3-t { background-color: var(--b3-tertiary); color: #5a5a1a; }

        .btn-b4-p { background-color: var(--b4-primary); color: #1a5a2b; }
        .btn-b4-s { background-color: var(--b4-secondary); color: #1a5a2b; }
        .btn-b4-t { background-color: var(--b4-tertiary); color: #1a5a2b; }

        .btn-b5-p { background-color: var(--b5-primary); color: #1a3c5a; }
        .btn-b5-s { background-color: var(--b5-secondary); color: #1a3c5a; }
        .btn-b5-t { background-color: var(--b5-tertiary); color: #1a3c5a; }

        .btn-b6-p { background-color: var(--b6-primary); color: #3c1a5a; }
        .btn-b6-s { background-color: var(--b6-secondary); color: #3c1a5a; }
        .btn-b6-t { background-color: var(--b6-tertiary); color: #3c1a5a; }

        .output-display {
            margin-top: 15px;
            padding: 15px;
            background: rgba(18, 16, 28, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(186, 85, 211, 0.25);
            width: 100%;
            box-sizing: border-box;
            color: #d8b4fe;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            min-height: 100px;
        }

        .db-status {
            font-size: 0.8rem;
            color: #c084fc;
            margin-top: 8px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-section" class="view-section">
        <div class="login-card">
            <h2 class="login-title">Clínica de la Convergencia</h2>
            <img src="logotipo.jpg" alt="Logotipo Clínica" class="login-logo">
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required autocomplete="username" placeholder="DRPEREYRA">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••">
                </div>
                <button type="submit" class="login-btn">Ingresar al Sistema</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-section" class="view-section hidden">
        <header class="app-header">
            <img src="logotipo.jpg" alt="Logotipo" class="header-logo">
            <div class="header-titles">
                <h1>Clínica de la Convergencia</h1>
                <p>Imágenes prismáticas de Psicoanálisis y Neurociencias</p>
            </div>
        </header>

        <div class="menu-container">
            <div id="linea-1" class="menu-line"></div>
            <div id="linea-2" class="menu-line"></div>
            <div id="linea-3" class="menu-line"></div>
        </div>

        <div id="output" class="output-display">Selecciona una opción del menú superior para comenzar...</div>
        <div id="db-status" class="db-status">Iniciando conexión con Firebase...</div>
    </div>

    <!-- SDKs de Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Archivo lógico -->
    <script src="app.js"></script>
</body>
</html>
