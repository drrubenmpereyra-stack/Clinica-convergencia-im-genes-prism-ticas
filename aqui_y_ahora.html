<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia - Aquí y Ahora (HPA)</title>
    <style>
        :root {
            --purple-glow: 0 0 12px rgba(186, 85, 211, 0.6), 0 0 24px rgba(160, 32, 240, 0.4);
            --purple-border: #ba55d3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(18, 16, 28, 0.92);
            color: #f1f1f1;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .admin-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            background: rgba(18, 16, 28, 0.88);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(186, 85, 211, 0.3);
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .admin-title {
            color: #e2b7ff;
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid rgba(186, 85, 211, 0.3);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group-pac {
            text-align: left;
        }

        .form-group-pac label {
            display: block;
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 5px;
        }

        .form-group-pac select, .form-group-pac textarea, .form-group-pac input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(28, 25, 42, 0.8);
            border: 1px solid rgba(186, 85, 211, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group-pac select option {
            background: #1c192a;
            color: #fff;
        }

        .form-group-pac select:focus, .form-group-pac textarea:focus, .form-group-pac input:focus {
            border-color: var(--purple-border);
            box-shadow: var(--purple-glow);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn-pac {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: #fff;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
        }

        .action-btn-pac:hover {
            transform: translateY(-2px);
            box-shadow: var(--purple-glow);
        }

        .msg-estado {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #38bdf8;
        }
    </style>

    <!-- SDKs de Firebase Compat alineados -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="view-section-ahora" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
        <div class="admin-container">
            <h3 class="admin-title">Cartografía de la Intersubjetividad: Aquí y Ahora - Eje HPA</h3>
            <form id="hpa-form">
                <div class="form-grid">
                    <div class="form-group-pac" style="grid-column: span 2;">
                        <label for="select-paciente">Seleccionar Paciente</label>
                        <select id="select-paciente" required>
                            <option value="">Cargando pacientes desde la base de datos...</option>
                        </select>
                    </div>
                    <div class="form-group-pac">
                        <label for="sincronia">Nivel de Sincronía Vincular (1-10)</label>
                        <input type="number" id="sincronia" min="1" max="10" required placeholder="Ej. 7">
                    </div>
                    <div class="form-group-pac">
                        <label for="marcador-somatico">Marcador Somático del Analista</label>
                        <input type="text" id="marcador-somatico" required placeholder="Ej. Constricción torácica leve">
                    </div>
                    <div class="form-group-pac" style="grid-column: span 2;">
                        <label for="notas-hpa">Observaciones Clínicas del Eje HPA y Discurso</label>
                        <textarea id="notas-hpa" rows="4" placeholder="Registro de la modulación autonómica y resonancia afectiva en sesión..."></textarea>
                    </div>
                </div>
                <div class="btn-container">
                    <button type="submit" class="action-btn-pac">Guardar Registro HPA</button>
                </div>
                <div id="msg-estado-hpa" class="msg-estado"></div>
            </form>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof firebase === 'undefined') {
                document.getElementById('msg-estado-hpa').innerText = "Error: Firebase no está disponible.";
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyAd5dyriu-Z2Gms1Tq9u8A75LrQKHd0GC8",
                authDomain: "aplicacion1-c794d.firebaseapp.com",
                projectId: "aplicacion1-c794d",
                storageBucket: "aplicacion1-c794d.firebasestorage.app",
                messagingSenderId: "310699962592",
                appId: "1:310699962592:web:71794de4268e47b35da085",
                measurementId: "G-R3QHSGSNQB"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            const selectPaciente = document.getElementById('select-paciente');
            const hpaForm = document.getElementById('hpa-form');
            const msgEstadoHpa = document.getElementById('msg-estado-hpa');

            // Cargar dinámicamente la lista de pacientes registrados en Firestore
            async function poblarSelectPacientes() {
                try {
                    const snapshot = await db.collection("pacientes").get();
                    selectPaciente.innerHTML = '<option value="">-- Seleccione un paciente --</option>';

                    if (snapshot.empty) {
                        selectPaciente.innerHTML = '<option value="">No hay pacientes registrados</option>';
                        return;
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const option = document.createElement('option');
                        option.value = doc.id;
                        option.textContent = `${data.nombre} (DNI: ${data.dni || 'S/D'})`;
                        selectPaciente.appendChild(option);
                    });
                } catch (error) {
                    console.error("Error al cargar pacientes para HPA:", error);
                    selectPaciente.innerHTML = '<option value="">Error al cargar lista</option>';
                }
            }

            poblarSelectPacientes();

            // Guardar registro del Aquí y Ahora HPA
            hpaForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const pacienteId = selectPaciente.value;
                const sincronia = document.getElementById('sincronia').value;
                const marcador = document.getElementById('marcador-somatico').value.trim();
                const notas = document.getElementById('notas-hpa').value.trim();

                if (!pacienteId) {
                    alert("Debe seleccionar un paciente.");
                    return;
                }

                msgEstadoHpa.innerText = "Guardando registro clínico...";

                try {
                    await db.collection("registros_hpa").add({
                        pacienteId,
                        sincronia: Number(sincronia),
                        marcadorSomatico: marcador,
                        notasHpa: notas,
                        fecha: new Date().toISOString()
                    });

                    msgEstadoHpa.innerText = "¡Registro del Eje HPA guardado exitosamente!";
                    hpaForm.reset();
                    poblarSelectPacientes();
                    setTimeout(() => { msgEstadoHpa.innerText = ""; }, 3000);
                } catch (error) {
                    console.error("Error al guardar HPA:", error);
                    msgEstadoHpa.style.color = "#ff8080";
                    msgEstadoHpa.innerText = `Error: ${error.message}`;
                }
            });
        });
    </script>
</body>
</html>
