<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de la Convergencia - Gestión de Pacientes</title>
    <style>
        :root {
            --purple-glow: 0 0 12px rgba(186, 85, 211, 0.6), 0 0 24px rgba(160, 32, 240, 0.4);
            --purple-border: #ba55d3;
        }

        .admin-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            background: rgba(18, 16, 28, 0.88);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(186, 85, 211, 0.3);
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .admin-title {
            color: #e2b7ff;
            font-size: 1.2rem;
            margin-top: 0;
            border-bottom: 1px solid rgba(186, 85, 211, 0.3);
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group-pac {
            text-align: left;
        }

        .form-group-pac label {
            display: block;
            font-size: 0.85rem;
            color: #d8b4fe;
            margin-bottom: 5px;
        }

        .form-group-pac input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(28, 25, 42, 0.8);
            border: 1px solid rgba(186, 85, 211, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group-pac input:focus {
            border-color: var(--purple-border);
            box-shadow: var(--purple-glow);
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .action-btn-pac {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            color: #fff;
        }

        .btn-registrar { background: linear-gradient(135deg, #9b59b6, #8e44ad); display: inline-block; }
        .btn-cancelar { background: linear-gradient(135deg, #7f8c8d, #616a6b); display: none; }

        .action-btn-pac:hover {
            transform: translateY(-2px);
            box-shadow: var(--purple-glow);
        }

        .patient-table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table.patient-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        table.patient-table th, table.patient-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(186, 85, 211, 0.2);
        }

        table.patient-table th {
            color: #e2b7ff;
            background: rgba(28, 25, 42, 0.9);
        }

        table.patient-table td {
            color: #e5e5e5;
        }

        .table-btn {
            padding: 5px 10px;
            font-size: 0.8rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-right: 5px;
        }

        .btn-edit-row { background-color: #f39c12; color: #fff; }
        .btn-delete-row { background-color: #e74c3c; color: #fff; }
        .msg-estado {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="view-section-pacientes" style="width: 100%; display: flex; flex-direction: column; gap: 15px;">
        <div class="admin-container">
            <h3 class="admin-title" id="form-title">Registrar Nuevo Paciente</h3>
            <form id="patient-form">
                <input type="hidden" id="patient-id" value="">
                <div class="form-grid">
                    <div class="form-group-pac">
                        <label for="nombre">Apellido y Nombres</label>
                        <input type="text" id="nombre" required placeholder="Ej. Pérez, Juan Carlos">
                    </div>
                    <div class="form-group-pac">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" required placeholder="Ej. 12345678">
                    </div>
                    <div class="form-group-pac">
                        <label for="telefono">Teléfono</label>
                        <input type="text" id="telefono" required placeholder="Ej. +54 9 351 ...">
                    </div>
                    <div class="form-group-pac">
                        <label for="profesion">Profesión</label>
                        <input type="text" id="profesion" required placeholder="Ej. Docente / Ingeniero">
                    </div>
                </div>
                <div class="btn-container">
                    <button type="submit" id="btn-accion" class="action-btn-pac btn-registrar">Registrar Paciente</button>
                    <button type="button" id="btn-cancelar" class="action-btn-pac btn-cancelar">Cancelar</button>
                </div>
                <div id="msg-estado" class="msg-estado"></div>
            </form>
        </div>

        <div class="admin-container">
            <h3 class="admin-title">Listado de Pacientes en Firestore</h3>
            <div class="patient-table-container">
                <table class="patient-table">
                    <thead>
                        <tr>
                            <th>Apellido y Nombres</th>
                            <th>DNI</th>
                            <th>Teléfono</th>
                            <th>Profesión</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="patient-table-body">
                        <!-- Registros cargados dinámicamente desde Firestore -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SDKs de Firebase Compat (versión 9.23.0 alineada con index.html) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof firebase === 'undefined') {
                document.getElementById('msg-estado').innerText = "Error crítico: El objeto firebase no está disponible.";
                return;
            }

            const firebaseConfig = {
                apiKey: "AIzaSyAd5dyriu-Z2Gms1Tq9u8A75LrQKHd0GC8",
                authDomain: "aplicacion1-c794d.firebaseapp.com",
                projectId: "aplicacion1-c794d",
                storageBucket: "aplicacion1-c794d.firebasestorage.app",
                messagingSenderId: "310699962592",
                appId: "1:310699962592:web:71794de4268e47b35da085",
                measurementId: "G-R3QHSGSNQB"
            };

            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            const db = firebase.firestore();

            const patientForm = document.getElementById('patient-form');
            const patientTableBody = document.getElementById('patient-table-body');
            const formTitle = document.getElementById('form-title');
            const btnAccion = document.getElementById('btn-accion');
            const btnCancelar = document.getElementById('btn-cancelar');
            const patientIdInput = document.getElementById('patient-id');
            const msgEstado = document.getElementById('msg-estado');

            cargarPacientesFirestore();

            patientForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const nombre = document.getElementById('nombre').value.trim();
                const dni = document.getElementById('dni').value.trim();
                const telefono = document.getElementById('telefono').value.trim();
                const profesion = document.getElementById('profesion').value.trim();
                const docId = patientIdInput.value;

                msgEstado.innerText = "Guardando en base de datos...";

                try {
                    if (docId) {
                        await db.collection("pacientes").doc(docId).set({
                            nombre, dni, telefono, profesion,
                            actualizado: new Date().toISOString()
                        }, { merge: true });
                        msgEstado.innerText = `Paciente ${nombre} actualizado correctamente.`;
                    } else {
                        await db.collection("pacientes").add({
                            nombre, dni, telefono, profesion,
                            creado: new Date().toISOString()
                        });
                        msgEstado.innerText = `Paciente ${nombre} registrado exitosamente.`;
                    }
                    
                    resetForm();
                    await cargarPacientesFirestore();
                    setTimeout(() => { msgEstado.innerText = ""; }, 3000);
                } catch (error) {
                    console.error("Error en Firestore:", error);
                    msgEstado.style.color = "#ff8080";
                    msgEstado.innerText = `Error: ${error.message}`;
                }
            });

            async function cargarPacientesFirestore() {
                patientTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#c084fc;">Cargando registros...</td></tr>`;
                try {
                    const snapshot = await db.collection("pacientes").get();
                    patientTableBody.innerHTML = '';

                    if (snapshot.empty) {
                        patientTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#b19cd9;">No hay pacientes registrados.</td></tr>`;
                        return;
                    }

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${data.nombre || ''}</td>
                            <td>${data.dni || ''}</td>
                            <td>${data.telefono || ''}</td>
                            <td>${data.profesion || ''}</td>
                            <td>
                                <button type="button" class="table-btn btn-edit-row" onclick="prepararEdicionFirestore('${doc.id}', '${escapeHtml(data.nombre)}', '${escapeHtml(data.dni)}', '${escapeHtml(data.telefono)}', '${escapeHtml(data.profesion)}')">Editar</button>
                                <button type="button" class="table-btn btn-delete-row" onclick="eliminarPacienteFirestore('${doc.id}', '${escapeHtml(data.nombre)}')">Eliminar</button>
                            </td>
                        `;
                        patientTableBody.appendChild(tr);
                    });
                } catch (error) {
                    console.error("Error al leer Firestore:", error);
                    patientTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#ff8080;">Error al cargar datos.</td></tr>`;
                }
            }

            window.prepararEdicionFirestore = function(id, nombre, dni, telefono, profesion) {
                patientIdInput.value = id;
                document.getElementById('nombre').value = nombre;
                document.getElementById('dni').value = dni;
                document.getElementById('telefono').value = telefono;
                document.getElementById('profesion').value = profesion;

                formTitle.innerText = "Modificar Datos del Paciente";
                btnAccion.innerText = "Guardar Cambios";
                btnAccion.style.background = "linear-gradient(135deg, #f39c12, #d68910)";
                btnCancelar.style.display = "inline-block";
            }

            btnCancelar.addEventListener('click', () => {
                resetForm();
            });

            function resetForm() {
                patientForm.reset();
                patientIdInput.value = "";
                formTitle.innerText = "Registrar Nuevo Paciente";
                btnAccion.innerText = "Registrar Paciente";
                btnAccion.style.background = "linear-gradient(135deg, #9b59b6, #8e44ad)";
                btnCancelar.style.display = "none";
            }

            window.eliminarPacienteFirestore = async function(id, nombre) {
                if (confirm(`¿Estás seguro de eliminar permanentemente a ${nombre}?`)) {
                    try {
                        await db.collection("pacientes").doc(id).delete();
                        msgEstado.innerText = `Paciente ${nombre} eliminado.`;
                        await cargarPacientesFirestore();
                        setTimeout(() => { msgEstado.innerText = ""; }, 3000);
                    } catch (error) {
                        console.error("Error al eliminar:", error);
                        msgEstado.style.color = "#ff8080";
                        msgEstado.innerText = `Error al eliminar: ${error.message}`;
                    }
                }
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            }
        });
    </script>
</body>
</html>
